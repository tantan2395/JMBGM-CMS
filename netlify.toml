[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_TLS_REJECT_UNAUTHORIZED = "0"

[context.production.environment]
  NODE_TLS_REJECT_UNAUTHORIZED = "0"

[context.deploy-preview.environment]
  NODE_TLS_REJECT_UNAUTHORIZED = "0"
